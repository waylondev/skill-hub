
## 阶段流程

技能按以下阶段顺序执行，每个阶段对应一个独立的指导文件（位于 `phases/` 目录）：

1. **Copybook 解析与转换** (`04-copybook.md`)  
   解析 COPY 语句，展开嵌套，生成 Java DTO 或记录类。

2. **业务逻辑迁移** (`05-logic.md`)  
   将 PROCEDURE DIVISION 转换为 Spring Service 或领域逻辑。

3. **目标架构设计** (`06-architecture.md`)  
   定义微服务拆分、通信方式、数据存储策略。

4. **交付物清单** (`08-deliverables.md`)  
   明确迁移产出的代码、配置、文档等。

5. **代码生成** (`09-codegen.md`)  
   基于中间表示生成 Java 代码、SQL 脚本等。

6. **DTO 规范** (`10-dto-specification.md`)  
   统一数据传输对象的命名、结构、校验规则。

7. **前端迁移** (`10-frontend-migration.md`)  
   处理 CICS BMS、SDF II 等屏幕定义到 Web 前端的转换。

8. **数据库迁移（Flyway）** (`11-flyway-migration.md`)  
   管理数据库版本，生成迁移脚本。

9. **CI/CD 流水线** (`12-cicd-pipeline.md`)  
   构建、测试、部署的自动化流水线定义。

10. **OpenAPI 规范** (`12-openapi.md`)  
    为生成的 REST API 编写 OpenAPI 文档。

11. **容器化与编排** (`13-docker-kubernetes.md`)  
    Docker 镜像构建及 Kubernetes 部署配置。

12. **安全审计** (`13-security-audit.md`)  
    源码安全扫描、敏感数据识别、许可证检查。

13. **批处理依赖分析** (`14-batch-deps.md`)  
    分析 JCL/PROC 中的作业依赖关系。

14. **开发者入职** (`14-developer-onboarding.md`)  
    新成员环境搭建、代码结构导航。

15. **消息队列目录** (`15-mq-catalog.md`)  
    梳理 MQ 队列、通道、消息格式。

16. **工具链实用程序** (`16-toolchain-utilities.md`)  
    辅助脚本、格式转换、编码处理工具。

17. **生产合规** (`17-production-compliance.md`)  
    确保迁移后系统满足运维、监控、审计要求。

18. **数据迁移策略** (`18-data-migration-strategy.md`)  
    历史数据清洗、转换、校验方案。

19. **回归测试** (`19-regression-testing.md`)  
    自动化回归测试框架与用例生成。

20. **性能基准测试** (`20-performance-benchmarking.md`)  
    迁移前后性能对比与调优建议。

21. **代码审查协议** (`cp-review-protocol.md`)  
    审查清单、评审流程、质量门禁。

## 增强功能（v2.0 新增，v2.1 完善）

### 增量分析与变更检测
- 基于 Git diff 或文件时间戳，仅分析变更的程序。
- 维护分析结果缓存，避免重复处理。

### 调用图与依赖分析
- 构建程序间调用图（CALL、LINK、XCTL）。
- 识别 Copybook 包含关系，生成依赖矩阵。
- 支持循环依赖检测与报告。

### 方言适配层
- 提供 COBOL 方言配置文件，声明关键字、内建函数、编译指令差异。
- 内置 IBM Enterprise COBOL、Micro Focus、GnuCOBOL 等预设。

### 动态调用处理策略
- 静态分析可解析的调用（常量 CALL）。
- 对动态调用提供桩代码生成或人工标注接口。

### 自动化回归测试框架
- 基于输入/输出对生成迁移前后的测试用例。
- 集成到 CI 流水线，确保行为一致。

### 安全与合规检查
- 扫描源码中的敏感字段（如 SSN、账号）。
- 生成数据流图，标记敏感数据路径。
- 检查第三方库许可证兼容性。

### 并行与分布式处理
- 支持按子系统/程序拆分任务，并行分析。
- 提供资源预估模型（CPU/内存/时间）。

### 断点续传与错误恢复
- 分析状态持久化，支持中断后从检查点继续。
- 错误隔离：单个程序失败不影响整体流程。

### 输入格式标准化
- 明确支持的编码（EBCDIC/ASCII）、记录长度、行号区域。
- 提供预处理工具（如 `iconv`、`cobol-formatter`）。

### 输出质量度量
- 定义迁移后代码的 KPI：编译通过率、测试覆盖率、圈复杂度变化。
- 生成质量报告并与基线对比。

## 用户使用增强（v2.1 新增）

### 日志与监控
- 每个阶段输出结构化日志（JSON 格式），包含时间戳、阶段名称、处理文件数、错误数等。
- 支持日志级别（DEBUG/INFO/WARN/ERROR）动态调整。
- 可集成 ELK/Loki 等日志平台，实现集中监控。

### 错误处理与故障排除
- 常见错误码及解决方案参考（见 `references/troubleshooting.md`）。
- 提供 `--dry-run` 模式，预览分析范围而不实际修改文件。
- 支持 `--resume` 从上次中断点继续执行。

### 报告与可视化
- 生成 HTML 格式的综合报告，包含：
  - 迁移进度概览
  - 调用图与依赖矩阵（可交互）
  - 风险热图（按程序/模块）
  - 质量 KPI 趋势图
- 报告可导出为 PDF，便于归档和审计。

### 配置管理
- 所有配置集中在 `cobol-modernization.yaml` 文件中。
- 支持多环境配置（开发、测试、生产），通过 `--env` 参数切换。
- 敏感信息（如数据库密码）支持通过环境变量或密钥管理服务注入。

### 最佳实践
- 建议在迁移前进行代码静态分析，识别死代码和未使用变量。
- 优先迁移独立模块或批处理作业，降低风险。
- 每个阶段完成后进行代码审查，确保符合团队规范。
- 保留原始 COBOL 源码及迁移中间产物，便于回溯。

### 常见问题（FAQ）
- **Q: 如何处理非标准 COBOL 语法？**  
  A: 使用方言配置文件添加自定义关键字或语法规则，或联系技能维护者扩展。
- **Q: 迁移后性能下降怎么办？**  
  A: 运行性能基准测试阶段，识别瓶颈并进行针对性优化（如数据库查询、循环逻辑）。
- **Q: 动态调用无法解析怎么办？**  
  A: 使用人工标注接口标记调用目标，或结合运行时追踪数据补充。
- **Q: 如何确保迁移后功能完全一致？**  
  A: 依赖自动化回归测试框架，并建议在测试环境进行并行运行验证。

### 性能调优建议
- 对于超大型代码库（>100 万行），建议使用分布式处理模式，并适当增加节点。
- 调整并行度参数 `--parallelism` 以匹配可用 CPU 核心数。
- 使用 SSD 存储中间产物，提升 I/O 性能。

### 安全最佳实践
- 在隔离的脱敏环境中执行分析，避免敏感数据泄露。
- 定期更新依赖库，扫描已知漏洞。
- 对生成的 Java 代码进行静态应用安全测试（SAST）。

### 集成与扩展
- 提供 REST API 接口，可与现有 CI/CD 工具链（Jenkins、GitLab CI）集成。
- 支持插件机制，允许自定义代码生成模板或分析规则。
- 可与 SonarQube、Checkmarx 等质量/安全平台对接。

