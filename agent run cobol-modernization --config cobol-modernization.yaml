## 使用方式

1. 运行交互式配置向导，生成配置文件。
2. （可选）执行 `--dry-run` 预览分析范围。
3. 运行增量分析，生成调用图和依赖矩阵。
4. 按阶段顺序执行迁移，每个阶段输出中间产物供下一阶段使用。
5. 在关键阶段后运行自动化回归测试，验证正确性。
6. 查看生成的 HTML 报告，评估质量和风险。
7. 最终通过 CI/CD 流水线部署至目标环境。

## 限制与注意事项

- 对于极度复杂的嵌套 Copybook（深度 > 20），建议人工拆分。
- 动态调用无法完全自动解析，需结合运行时追踪或人工标注。
- 迁移后的性能需通过基准测试验证，必要时进行调优。
- 敏感数据在分析过程中应使用脱敏环境或加密存储。
- 首次全量分析可能耗时较长，建议在非高峰时段执行或使用分布式处理。

